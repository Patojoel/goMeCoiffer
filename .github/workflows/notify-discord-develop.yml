# Prévient le salon Discord de l'équipe à chaque mise à jour de develop (préprod).
# Secret requis (Settings > Secrets and variables > Actions) : DISCORD_WEBHOOK_URL, jamais écrit dans le dépôt.
name: Notification Discord (develop)

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Prévenir Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          # Messages de commit passés en variable puis lus par jq : jamais insérés dans le script.
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Secret DISCORD_WEBHOOK_URL absent : aucune notification envoyée."
            exit 0
          fi
          # Auteur et titres des commits seulement : ni identifiant de commit, ni lien, ni clé.
          payload=$(jq -n --arg actor "$ACTOR" --argjson commits "$COMMITS" '
            ([$commits[] | "• " + (.message | split("\n")[0])] | .[0:10] | join("\n")) as $list
            | { username: "GoMeCoiffer",
                content: ("**develop mis à jour** par " + $actor + " — " + ($commits | length | tostring)
                          + " commit(s)\n" + $list)[0:1900] }')
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
